[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redactor"
version = "0.1.0"
description = "Remove personal information from lab-report PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
redactor = "redactor.cli:main"

[tool.setuptools]
packages = ["redactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["redactor"]
branch = true

[tool.coverage.report]
show_missing = true
